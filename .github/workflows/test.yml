name: Windows checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npx playwright install msedge
      - run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File download-runtime.ps1
      - run: node scripts/test.mjs full --force
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-validation-${{ github.run_attempt }}
          path: work/validation/
